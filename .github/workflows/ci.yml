name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 matches the Dockerfile, 24 matches the dev machine.
        node: [20, 24]

    # the route tests boot the real server on a throwaway database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Global contract
        run: node scripts/check-globals.mjs

      - name: Require contract
        run: node scripts/check-requires.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Route tests
        run: npm run test:routes
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASS: postgres

      - name: Build
        run: npm run build
