<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PipekAI — Change Password</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=1.13.1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=1.13.1" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=1.13.1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <!-- Same theme key and default as chat/admin, applied before first paint. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ag_theme') || 'light';
                if (t !== 'dark' && t !== 'light') t = 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) { /* localStorage blocked → default light */ }
        })();
    </script>
    <style>
        /* Same background as login.html. */
        .auth-bg {
            background:
                radial-gradient(760px 520px at 10% 6%, rgba(37, 99, 235, 0.34) 0%, transparent 65%),
                radial-gradient(700px 480px at 92% 94%, rgba(59, 130, 246, 0.38) 0%, transparent 65%),
                radial-gradient(560px 340px at 62% 28%, rgba(147, 197, 253, 0.30) 0%, transparent 70%),
                linear-gradient(160deg, #d9e5fb 0%, #e6edfa 50%, #eef3fb 100%);
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(37, 99, 235, 0.13) 1px, transparent 1.5px);
            background-size: 22px 22px;
            mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 100%);
            -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 100%);
        }
        :root[data-theme="dark"] .auth-bg {
            background:
                radial-gradient(720px 480px at 12% 8%, rgba(59, 130, 246, 0.28) 0%, transparent 65%),
                radial-gradient(640px 440px at 90% 92%, rgba(37, 99, 235, 0.24) 0%, transparent 65%),
                linear-gradient(160deg, #0d1220 0%, #0b0e15 60%, #0b0d12 100%);
        }
        :root[data-theme="dark"] .auth-bg::before {
            background-image: radial-gradient(rgba(91, 155, 255, 0.16) 1px, transparent 1.5px);
        }

        .mascot {
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 14px 18px rgba(37, 99, 235, 0.18));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            45% { transform: translateY(-10px); }
            60% { transform: translateY(-9px); }
        }
        @media (prefers-reduced-motion: reduce) { .mascot { animation: none; } }

        /* change-password.js sets .met / .miss on each rule and toggles .show on the error box. */
        .pw-rule { color: var(--text-3); }
        .pw-rule.met { color: var(--success); }
        .error-msg { display: none; }
        .error-msg.show { display: block; }
    </style>
</head>

<body class="auth-bg relative min-h-dvh grid place-items-center px-6 py-10 font-sans text-[14px] leading-normal text-text-1 antialiased">
    <div class="relative w-full max-w-[420px]">
        <div class="rounded-xl border border-line bg-surface px-8 pt-8 pb-7 shadow-lg">
            <div class="text-center">
                <img class="mascot mx-auto h-24 w-24 object-contain" src="/assets/mascot.png?v=2" alt="" />
                <h1 class="mt-2 text-[20px] font-bold tracking-tight">Set a new password</h1>
                <p class="mb-5 text-[13px] text-text-3">Signed in as <span class="font-mono" id="who">—</span>. Choose your own password before you start.</p>
            </div>

            <div class="mb-4 rounded-md border border-warning/30 bg-warning-weak px-3.5 py-2.5 text-[12.5px] leading-normal text-warning">
                This password was set by an admin. After you change it, the old one no longer works.
            </div>
            <div class="error-msg mb-4 rounded-md border border-danger/30 bg-danger-weak px-3.5 py-2.5 text-[13px] text-danger" id="error-msg"></div>

            <form id="pw-form" onsubmit="handleChange(event)">
                <div class="mb-3.5 flex flex-col gap-1.5">
                    <label class="text-[13px] font-medium" for="cur-pw">Current password</label>
                    <input class="h-[42px] w-full rounded-md border border-line-strong bg-surface px-3 text-text-1 outline-none placeholder:text-text-4 focus:border-accent focus:shadow-ring" id="cur-pw" type="password" autocomplete="current-password"
                        placeholder="The password you signed in with" required />
                </div>
                <div class="mb-3.5 flex flex-col gap-1.5">
                    <label class="text-[13px] font-medium" for="new-pw">New password</label>
                    <input class="h-[42px] w-full rounded-md border border-line-strong bg-surface px-3 text-text-1 outline-none placeholder:text-text-4 focus:border-accent focus:shadow-ring" id="new-pw" type="password" autocomplete="new-password"
                        placeholder="At least 8 characters, letters and numbers" required oninput="updateRules()" />
                </div>
                <div class="mb-3.5 flex flex-col gap-1.5">
                    <label class="text-[13px] font-medium" for="new-pw2">Confirm new password</label>
                    <input class="h-[42px] w-full rounded-md border border-line-strong bg-surface px-3 text-text-1 outline-none placeholder:text-text-4 focus:border-accent focus:shadow-ring" id="new-pw2" type="password" autocomplete="new-password"
                        placeholder="Type it again" required oninput="updateRules()" />
                </div>
                <div class="mb-5 flex flex-col gap-1 font-mono text-[12px] leading-relaxed" id="pw-rules">
                    <div class="pw-rule miss" id="r-len">○ At least 8 characters</div>
                    <div class="pw-rule miss" id="r-letter">○ Contains a letter (A-Z, a-z)</div>
                    <div class="pw-rule miss" id="r-digit">○ Contains a number (0-9)</div>
                    <div class="pw-rule miss" id="r-match">○ Both fields match</div>
                </div>
                <button class="h-[42px] w-full cursor-pointer rounded-md bg-accent font-medium text-on-accent transition-colors hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60" type="submit" id="submit-btn" disabled>Change password</button>
                <button class="mt-3 w-full cursor-pointer text-[12.5px] text-text-3 hover:text-text-1" type="button" onclick="signOut()">Log out</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/pages/change-password-page.js"></script>
</body>

</html>
