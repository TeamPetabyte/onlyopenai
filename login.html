<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PipekAI — Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=1.16.1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=1.16.1" />
    <link rel="apple-touch-icon" href="/assets/favicon-180.png?v=1.16.1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <!-- Same theme key and default as chat/admin, applied before first paint. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ag_theme') || 'light';
                if (t !== 'dark' && t !== 'light') t = 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) { /* localStorage blocked → default light */ }
        })();
    </script>
    <style>
        /* Pastel background: soft blue, lavender and mint washes over a near-white base. */
        .auth-bg {
            background:
                radial-gradient(720px 520px at 8% 4%, rgba(147, 197, 253, 0.42) 0%, transparent 65%),
                radial-gradient(680px 480px at 94% 96%, rgba(196, 181, 253, 0.36) 0%, transparent 65%),
                radial-gradient(520px 360px at 70% 20%, rgba(167, 243, 208, 0.26) 0%, transparent 70%),
                linear-gradient(160deg, #eef2fc 0%, #f4f0fb 50%, #edf5fb 100%);
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1.5px);
            background-size: 22px 22px;
            mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 100%);
            -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 100%);
        }
        :root[data-theme="dark"] .auth-bg {
            background:
                radial-gradient(720px 480px at 12% 8%, rgba(96, 165, 250, 0.20) 0%, transparent 65%),
                radial-gradient(640px 440px at 90% 92%, rgba(167, 139, 250, 0.16) 0%, transparent 65%),
                linear-gradient(160deg, #0f1220 0%, #0d0f18 60%, #0b0d12 100%);
        }
        :root[data-theme="dark"] .auth-bg::before {
            background-image: radial-gradient(rgba(147, 197, 253, 0.12) 1px, transparent 1.5px);
        }

        /* Frosted card: lets the pastel show through instead of a hard white block. */
        .auth-card {
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 20px 50px rgba(37, 99, 235, 0.10), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        :root[data-theme="dark"] .auth-card {
            background: rgba(18, 21, 28, 0.66);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* Mascot bobs like it is floating; slow rise, quicker fall. */
        .mascot {
            animation: float 4.5s ease-in-out infinite;
            filter: drop-shadow(0 14px 18px rgba(37, 99, 235, 0.18));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            45% { transform: translateY(-10px); }
            60% { transform: translateY(-9px); }
        }
        @media (prefers-reduced-motion: reduce) { .mascot { animation: none; } }

        /* login.js toggles .show; the logged-out variant recolours it inline. */
        .error-msg { display: none; }
        .error-msg.show { display: block; }
    </style>
</head>

<body class="auth-bg relative min-h-dvh grid place-items-center px-6 py-10 font-sans text-[14px] leading-normal text-text-1 antialiased">
    <div class="relative w-full max-w-[400px]">
        <div class="auth-card rounded-xl px-8 pt-9 pb-8 text-center">
            <img class="mascot mx-auto h-40 w-40 object-contain" src="/assets/mascot.png?v=2" alt="" />
            <h1 class="mt-2 text-[24px] font-bold tracking-tight">PipekAI</h1>
            <p class="mb-6 text-[13.5px] text-text-3">AI coding assistant for SAP / ABAP</p>

            <!-- Single login form: the server decides the role from the user record. -->
            <div class="error-msg mb-4 rounded-md border border-danger/30 bg-danger-weak px-3.5 py-2.5 text-left text-[13px] text-danger" id="error-msg"></div>

            <form id="login-form" class="text-left" onsubmit="handleLogin(event)">
                <div class="mb-3.5 flex flex-col gap-1.5">
                    <label class="text-[13px] font-medium" for="username">Username</label>
                    <div class="flex h-[42px] items-center gap-2 rounded-md border border-line-strong bg-surface/70 px-3 text-text-3 focus-within:border-accent focus-within:shadow-ring">
                        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input class="min-w-0 flex-1 bg-transparent text-text-1 outline-none placeholder:text-text-4" id="username" type="text" placeholder="Enter your username"
                            autocomplete="username" required />
                    </div>
                </div>
                <div class="mb-3.5 flex flex-col gap-1.5">
                    <label class="text-[13px] font-medium" for="password">Password</label>
                    <div class="flex h-[42px] items-center gap-2 rounded-md border border-line-strong bg-surface/70 px-3 text-text-3 focus-within:border-accent focus-within:shadow-ring">
                        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input class="min-w-0 flex-1 bg-transparent text-text-1 outline-none placeholder:text-text-4" id="password" type="password" placeholder="Enter your password"
                            autocomplete="current-password" required />
                        <button class="grid h-6 w-6 shrink-0 cursor-pointer place-items-center rounded-sm text-text-3 hover:bg-surface-3 hover:text-text-1" type="button"
                            aria-label="Show password" aria-pressed="false"
                            onclick="var p=document.getElementById('password');var show=p.type==='password';p.type=show?'text':'password';this.setAttribute('aria-pressed',show);this.setAttribute('aria-label',show?'Hide password':'Show password')">
                            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button class="mt-1.5 h-[42px] w-full cursor-pointer rounded-md bg-accent font-medium text-on-accent transition-colors hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60" type="submit" id="login-btn">Log in</button>
            </form>
        </div>

        <div class="mt-4 text-center text-[12px] text-text-3">
            PipekAI <span class="font-mono text-[11.5px]" id="app-version"></span> · 2026
        </div>
    </div>

    <script type="module" src="js/pages/login-page.js"></script>
</body>

</html>
